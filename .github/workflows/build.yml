name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# avoid piling up builds on rapid pushes
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each macOS arch builds on a native-arch runner: PyInstaller can't cross-compile, so the
          # frozen sidecar must be made on the arch it ships to (x64 on Intel, arm64 on M-series).
          - { os: macos-latest, eb: '--mac --arm64', artifact: macos-arm64 }
          - { os: macos-15-intel, eb: '--mac --x64', artifact: macos-x64 }
          - { os: windows-latest, eb: '--win', artifact: windows }
          - { os: ubuntu-latest, eb: '--linux', artifact: linux }
    steps:
      - name: Checkout (with engine submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1) Freeze the Python sidecar (tapeflow_engine + hdvmerge + dvmerge) into a standalone binary,
      #    natively for this OS/arch, so the shipped app needs no Python.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build sidecar (PyInstaller)
        shell: bash
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --clean \
            --distpath engine/dist --workpath engine/build \
            engine/tapeflow-engine.spec
      - name: Smoke-test the sidecar
        shell: bash
        run: |
          BIN="engine/dist/tapeflow-engine/tapeflow-engine"
          [ "${{ runner.os }}" = "Windows" ] && BIN="engine/dist/tapeflow-engine/tapeflow-engine.exe"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"capabilities","params":{}}' | "$BIN" | head -c 400
          echo

      # 2) Build the Electron app and package it (the sidecar is copied in via extraResources).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app deps
        working-directory: app
        run: npm ci
      - name: Build renderer + main
        working-directory: app
        run: npm run build
      - name: Package (electron-builder)
        working-directory: app
        run: npx electron-builder ${{ matrix.eb }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # no code-signing certs yet — build unsigned (macOS users right-click → Open once)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: tapeflow-${{ matrix.artifact }}
          if-no-files-found: ignore
          path: |
            app/release/*.dmg
            app/release/*.zip
            app/release/*.exe
            app/release/*.AppImage
            app/release/*.deb

  # On a version tag, gather every platform's installers into a GitHub Release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
