[project]
name = "tapeflow-engine"
# Single source of truth: tapeflow_engine.__version__ (kept in lock-step with app/package.json).
dynamic = ["version"]
description = "tapeflow's Python sidecar: route DV/HDV captures to the merge engines and serve a unified JSON-RPC analysis over stdio"
requires-python = ">=3.11"
# The merge engines are provided as git submodules under ../engines and made importable either by
# an editable install in dev (`pip install -e ../engines/hdvmerge ../engines/dvmerge`) or by being
# frozen in for release. As a zero-setup fallback the sidecar also adds the submodule `src/` dirs to
# sys.path when the engines aren't already importable (see tapeflow_engine/_bootstrap.py).

[project.scripts]
# A thin one-shot CLI over the same sidecar methods the desktop app drives over JSON-RPC, for
# scripting and automated agents (see tapeflow_engine/cli.py). Also runnable without an install as
# `python -m tapeflow_engine.cli`.
tapeflow = "tapeflow_engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "tapeflow_engine.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
